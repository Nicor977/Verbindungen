<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMV-Test</title>
<style>
body { font: 16px/1.4 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: #f4f5f2; color: #1b1f1d; }
input, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-top: 8px; }
button { background: #0b6e4f; color: #fff; border: 0; font-weight: 600; cursor: pointer; }
pre { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; }
.ok { color: #1e8449; font-weight: 600; } .bad { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<h1>RMV-Schnittstelle testen</h1>
<p>Prüft, ob die RMV-API direkt aus dem Browser erreichbar ist. Der Schlüssel wird nirgends gespeichert und nur an rmv.de geschickt.</p>
<input type="password" id="key" placeholder="RMV-API-Schlüssel" autocomplete="off">
<button id="go">Testen</button>
<div id="out"></div>
<script>
const out = document.getElementById("out");
document.getElementById("go").addEventListener("click", async () => {
  const key = document.getElementById("key").value.trim();
  if (!key) { out.innerHTML = '<p class="bad">Bitte Schlüssel eingeben.</p>'; return; }
  out.innerHTML = "<p>Teste …</p>";
  const url = "https://www.rmv.de/hapi/location.name?" + new URLSearchParams({ accessId: key, input: "Hattersheim", format: "json" });
  try {
    const res = await fetch(url);
    const text = await res.text();
    let detail = text.slice(0, 400);
    try {
      const j = JSON.parse(text);
      const names = (j.stopLocationOrCoordLocation || []).map((x) => (x.StopLocation || x.CoordLocation || {}).name).filter(Boolean);
      if (names.length) detail = "Gefunden: " + names.slice(0, 3).join(", ");
      else if (j.errorCode) detail = "Fehler von RMV: " + j.errorCode + " " + (j.errorText || "");
    } catch {}
    out.innerHTML = res.ok
      ? `<p class="ok">✓ Browser-Zugriff klappt (HTTP ${res.status}).</p><pre></pre>`
      : `<p class="ok">✓ Browser-Zugriff klappt, aber RMV meldet HTTP ${res.status} (Schlüssel prüfen).</p><pre></pre>`;
    out.querySelector("pre").textContent = detail;
  } catch (e) {
    out.innerHTML = `<p class="bad">✗ Kein Zugriff aus dem Browser (vermutlich blockiert RMV das per CORS).</p><pre></pre>`;
    out.querySelector("pre").textContent = String(e);
  }
});
</script>
</body>
</html>
