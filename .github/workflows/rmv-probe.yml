name: Live-Seite prüfen
on:
  push:
    branches: [rmv-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 75
          npm i --silent playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const c = await b.newContext({ timezoneId: 'Europe/Berlin' }); const p = await c.newPage();
            p.on('pageerror', e => console.log('pageerror:', e.message));
            await p.goto('https://nicor977.github.io/Verbindungen/?v=' + Date.now());
            await p.waitForSelector('#results .trip', { timeout: 60000 }); await p.waitForTimeout(3000);
            console.log('Hat past-Bereich:', !!(await p.$('#past')));
            const f = (sel) => p.$$eval(sel, d => d.map(x => x.className + ' | ' + x.querySelector('.times').textContent.replace(/\s+/g, ' ') + ' | ' + x.querySelector('.chips').textContent));
            console.log('Vergangen:', JSON.stringify(await f('#past .trip'), null, 1));
            console.log('Aktuell:', JSON.stringify(await f('#results .trip'), null, 1));
            await b.close();
          })();
          JS
          node t.js
