name: RMV-Worker prüfen
on:
  push:
    branches: [rmv-worker]
    paths: [".github/workflows/rmv-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live-Seite im Browser testen
        run: |
          sleep 60
          npm i --silent playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            p.on('console', m => console.log('console:', m.text()));
            let st; p.on('response', r => { if (r.url().includes('workers.dev')) st = r.status(); });
            await p.goto('https://nicor977.github.io/Verbindungen/?v=' + Date.now());
            await p.waitForSelector('.trip', { timeout: 60000 }); await p.waitForTimeout(3000);
            console.log('Worker-Status:', st);
            console.log('Meldungen:', await p.$$eval('#meldungen summary', d => d.map(x => x.textContent)));
            console.log('Warnungen:', await p.$$eval('.trip', d => d.map(x => x.querySelector('.chips').textContent + ' | ' + [...x.querySelectorAll('.warn')].map(w => w.textContent).join(' / '))));
            await b.close();
          })();
          JS
          node t.js
